apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - gateway.yaml
# The deployment profile (routes, clusters, header names). This default has no routes; replace it from an overlay:
#   configMapGenerator:
#     - name: auth-gateway-profile
#       behavior: replace
#       files: [gateway.json=my-profile.json]
configMapGenerator:
  - name: auth-gateway-profile
    files:
      - gateway.json=profile.json

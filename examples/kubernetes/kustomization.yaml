# A local trial of the gateway on any Kubernetes cluster, with development credentials instead of Entra and a demo
# backend behind it. Not for production: DevelopmentAuth is a fixed username and password.
#
#   kubectl apply -k examples/kubernetes
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: auth-gateway-demo
resources:
  - namespace.yaml
  - ../../deploy/kubernetes
  - backend.yaml
# Both images are built locally (see the README quick start) and loaded into the cluster.
images:
  - name: auth-gateway
    newName: auth-gateway
    newTag: local
  - name: demo-backend
    newName: auth-gateway-demo-backend
    newTag: local
patches:
  - path: development-patch.yaml
    target:
      kind: Deployment
      name: auth-gateway
configMapGenerator:
  # Replaces the base's empty profile with the quick start's routes.
  - name: auth-gateway-profile
    behavior: replace
    files:
      - gateway.json=profile.json
  - name: auth-gateway-env
    literals:
      - DOTNET_ENVIRONMENT=Development
      - DevelopmentAuth__Enabled=true
      - DevelopmentAuth__TenantId=00000000-0000-0000-0000-000000000001
      - DevelopmentAuth__ObjectId=00000000-0000-0000-0000-000000000002
secretGenerator:
  - name: auth-gateway-secrets
    literals:
      - DevelopmentAuth__Password=dev-password

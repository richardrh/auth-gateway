apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-backend
  labels:
    app.kubernetes.io/name: demo-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: demo-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: demo-backend
    spec:
      automountServiceAccountToken: false
      containers:
        - name: demo-backend
          image: demo-backend
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1654
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: demo-backend
spec:
  selector:
    app.kubernetes.io/name: demo-backend
  ports:
    - name: http
      port: 80
      targetPort: http
